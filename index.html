<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile</title>
  <style>
    body {
      background: linear-gradient(to right, #e0eafc, #cfdef3);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
  
    .card {
      background: #fff;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 360px;
      text-align: center;
      transition: transform 0.3s ease;
    }
  
    .card:hover {
      transform: translateY(-5px);
    }
  
    .card img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
      border: 5px solid #4f46e5;
    }
  
    .card h2 {
      margin: 10px 0 5px;
      font-size: 16px;
    }
  
    .designation {
      color: #777;
      font-size: 15px;
      margin-bottom: 25px;
    }
  
    .info {
      text-align: left;
      margin: 10px 0;
      font-size: 14px;
      line-height: 1.6;
    }
  
    .info strong {
      display: inline-block;
      width: 80px;
      color: #333;
    }
  
    .info a {
      color: #4f46e5;
      text-decoration: none;
    }
  
    .company-link {
      display: inline-block;
      margin-top: 25px;
      text-decoration: none;
      background: #4f46e5;
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: bold;
      transition: background 0.3s ease;
    }
  
    .company-link:hover {
      background: #3730a3;
    }
  
    @media screen and (max-width: 480px) {
      .card {
        padding: 30px 20px;
      }
      .info strong {
        width: 70px;
      }
      .card img {
        width: 100px;
        height: 100px;
      }
      .card h2 {
        font-size: 16px;
      }
    }
  </style>
  
</head>
<body>
  <div class="card">
    <img src="./assets/WhatsApp Image 2025-03-20 at 1.41.44 PM.jpeg" alt="Jannu" />
    <h2>Jannu<h2>
    <p class="designation">Software Developer</p>

    <p class="info"><strong>Email:</strong> <a href="mailto:aishwaryavj1733@gmail.com">aishwaryavj1733@gmail.com</a></p>
    <p class="info"><strong>Phone:</strong> +91-9999999999</p>
    <p class="info"><strong>Address:</strong> RR Nagar, Bangalore</p>
    <p class="info"><strong>LinkedIn:</strong> <a href="http://www.linkedin.com/in/aishwarya-jannu-584399225" target="_blank">Aishwarya Jannu</a></p>

    <a class="company-link" href="https://acespireconsulting.com" target="_blank">
      Learn more about Acespire Consulting
    </a>
  </div>
</body>
</html>
